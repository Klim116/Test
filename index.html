<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <title>STUNT EJECT</title>
        <link rel="preconnect" href="https://bridge.playgama.com">
        <link rel="preload" href="Build/Play Gama Eject.wasm.unityweb" as="fetch" type="application/wasm" crossorigin>
        <link rel="preload" href="Build/Play Gama Eject.data.unityweb" as="fetch" crossorigin>
        <link rel="preload" href="Build/Play Gama Eject.framework.js.unityweb" as="script">
        <style>
            html, body {
                width: 100%;
                height: 100%;
                padding: 0px;
                margin: 0px;
            }
            .fullscreen-canvas {
                background: #242424;
                width: 100%;
                height: 100%;
                position: absolute;
                top: 0px;
                left: 0px;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas" class="fullscreen-canvas"></canvas>
        <script>
            (function () {
                var canvas = document.getElementById('canvas');
                function fit() {
                    var dpr = Math.min(window.devicePixelRatio || 1, 2);
                    var r = canvas.getBoundingClientRect();
                    var w = Math.max(1, Math.round(r.width * dpr));
                    var h = Math.max(1, Math.round(r.height * dpr));
                    if (canvas.width !== w || canvas.height !== h) {
                        canvas.width = w;
                        canvas.height = h;
                    }
                }
                window.addEventListener('resize', fit);
                window.addEventListener('orientationchange', fit);
                if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);
                fit();
                // Unity выставляет размер буфера при старте — повторяем после инициализации
                setTimeout(fit, 500);
                setTimeout(fit, 1500);
                setTimeout(fit, 3000);
            })();
        </script>
        <script src="./playgama-bridge-unity.js"></script>
    </body>
</html>
