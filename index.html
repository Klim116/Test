<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <title>Yeet the Driver</title>
        <link rel="preload" href="Build/Play Gama Eject.wasm.unityweb" as="fetch" type="application/wasm" crossorigin>
        <link rel="preload" href="Build/Play Gama Eject.data.unityweb" as="fetch" crossorigin>
        <link rel="preload" href="Build/Play Gama Eject.framework.js.unityweb" as="script">
        <style>
            html, body {
                width: 100%;
                height: 100%;
                padding: 0px;
                margin: 0px;
                overflow: hidden;
                background: #242424;
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                -moz-user-select: none;
                user-select: none;
                touch-action: none;
                overscroll-behavior: none;
            }
            .fullscreen-canvas {
                background: #242424;
                width: 100%;
                height: 100%;
                position: absolute;
                top: 0px;
                left: 0px;
                touch-action: none;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas" class="fullscreen-canvas"></canvas>
        <script>
            (function () {
                var canvas = document.getElementById('canvas');
                var lastW = 0, lastH = 0;

                // Долгое нажатие не должно выделять текст и открывать меню браузера
                document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, { passive: false });
                document.addEventListener('selectstart', function (e) { e.preventDefault(); });
                document.addEventListener('dragstart', function (e) { e.preventDefault(); });

                function fit() {
                    var dpr = Math.min(window.devicePixelRatio || 1, 2);
                    var r = canvas.getBoundingClientRect();
                    var w = Math.max(1, Math.round(r.width * dpr));
                    var h = Math.max(1, Math.round(r.height * dpr));
                    if (w === lastW && h === lastH) return;
                    lastW = w; lastH = h;
                    if (canvas.width !== w) canvas.width = w;
                    if (canvas.height !== h) canvas.height = h;
                    // Unity узнаёт о новом размере по событию resize
                    try { window.dispatchEvent(new Event('resize')); } catch (e) { }
                }

                // Поворот в WebView/iframe часто не присылает resize — опрашиваем размер сами
                setInterval(fit, 200);
                window.addEventListener('resize', fit);
                window.addEventListener('orientationchange', function () { setTimeout(fit, 50); });
                if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
                if (window.ResizeObserver) new ResizeObserver(fit).observe(canvas);
                fit();
                // Unity выставляет размер буфера при старте — повторяем после инициализации
                setTimeout(fit, 500);
                setTimeout(fit, 1500);
                setTimeout(fit, 3000);
            })();
        </script>
        <script src="./playgama-bridge-unity.js"></script>
    </body>
</html>
